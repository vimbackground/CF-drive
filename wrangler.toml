# Cloudflare Workers Builds provisions R2 and D1 on the first deploy.
# Do not add resource names or IDs here: they would opt out of this fresh-instance flow.
name = "cf-drive"
main = "worker.js"
compatibility_date = "2026-09-15"

[[r2_buckets]]
binding = "R2_BUCKET"

[[d1_databases]]
binding = "DB"

[vars]
# Keep WebDAV disabled during the first deployment smoke test.
WEBDAV_ENABLED = "false"
# This is a server-side request cap, not an R2 quota. Raise only after testing.
WEBDAV_MAX_UPLOAD_BYTES = "104857600"
